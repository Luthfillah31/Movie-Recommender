[workspace]
authors = ["Luthfi <luthfillahatar@gmail.com>"]
channels = ["conda-forge"]
name = "Movie Recommender"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
ipykernel = ">=7.2.0,<8"
requests = ">=2.34.2,<3"
aiohttp = ">=3.13.5,<4"
tenacity = ">=9.1.4,<10"
python = "3.11.*"
pandas = "*"
streamlit = "*"
numpy = "<2"

[pypi-dependencies]
python-dotenv = "*"
pinecone-text = ">=0.11.0, <0.12"
pinecone = "*"
langchain = "*"
langchain-pinecone = "*"
langchain-openai = "*"
langchain-huggingface = "*"
pyreadline3 = ">=3.5.6, <4"
sentence-transformers = ">=5.5.1, <6"
narwhals = "*"
torch = ">=2.12.0, <3"
torchvision = ">=0.27.0, <0.28"

[activation.env]
PYTHONNOUSERSITE = "1"