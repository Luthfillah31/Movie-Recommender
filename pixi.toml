[workspace]
authors = ["Luthfi <luthfillahatar@gmail.com>"]
channels = ["conda-forge"]
name = "Movie Recommender"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
ipykernel = ">=7.2.0,<8"
requests = ">=2.34.2,<3"
aiohttp = ">=3.13.5,<4"
tenacity = ">=9.1.4,<10"
python = "3.11.*"
pandas = "*"
streamlit = "*"
numpy = "<2"

[pypi-dependencies]
python-dotenv = "*"
pinecone = ">=4.0.0"          # Forces the new Pinecone SDK
pinecone-text = "*"
langchain = ">=0.2.0"         # Forces modern LangChain
langchain-pinecone = ">=0.1.1" # Forces the version that contains PineconeVectorStore
langchain-openai = ">=0.1.0"
langchain-huggingface = "*"
pyreadline3 = "*"
sentence-transformers = "*"
narwhals = "*"
torch = ">=2.12.0, <3"
torchvision = ">=0.27.0, <0.28"
dotenv = ">=0.9.9, <0.10"
aiohttp = "*"

[activation.env]
PYTHONNOUSERSITE = "1"
